<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Waving robot">
  <title>Waving robot</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8db9ff" />
      <stop offset="1" stop-color="#2f81f7" />
    </linearGradient>
    <style>
      .ball { animation: pulse 1.6s ease-in-out infinite;
              transform-box: fill-box; transform-origin: center; }
      .eyes { animation: blink 4.2s ease-in-out infinite;
              transform-box: fill-box; transform-origin: center; }
      .arm  { animation: wave 1.1s ease-in-out infinite;
              transform-box: view-box; transform-origin: 152.5px 152px; }

      @keyframes pulse {
        0%, 100% { transform: scale(1);    opacity: 0.9; }
        50%      { transform: scale(1.35); opacity: 1; }
      }
      @keyframes blink {
        0%, 88%, 100% { transform: scaleY(1); }
        92%           { transform: scaleY(0.12); }
        96%           { transform: scaleY(1); }
      }
      @keyframes wave {
        0%, 100% { transform: rotate(-6deg); }
        50%      { transform: rotate(-34deg); }
      }
    </style>
  </defs>

  <!-- antenna -->
  <rect x="97.5" y="30" width="5" height="22" rx="2.5" fill="#9fb8d8" />
  <circle class="ball" cx="100" cy="26" r="7" fill="#ff2e6b" />

  <!-- ears -->
  <rect x="34" y="82" width="11" height="26" rx="5.5" fill="#2f81f7" />
  <rect x="155" y="82" width="11" height="26" rx="5.5" fill="#2f81f7" />

  <!-- head -->
  <rect x="45" y="50" width="110" height="88" rx="24" fill="url(#metal)" />

  <!-- face screen -->
  <rect x="57" y="64" width="86" height="58" rx="14" fill="#0b1b2b" opacity="0.88" />

  <!-- eyes (blink together) -->
  <g class="eyes">
    <circle cx="84" cy="88" r="6.5" fill="#64f0ff" />
    <circle cx="116" cy="88" r="6.5" fill="#64f0ff" />
  </g>

  <!-- mouth -->
  <rect x="90" y="103" width="20" height="5" rx="2.5" fill="#64f0ff" opacity="0.8" />

  <!-- neck + body -->
  <rect x="91" y="136" width="18" height="12" fill="#2f81f7" />
  <rect x="62" y="146" width="76" height="40" rx="16" fill="url(#metal)" />
  <circle cx="100" cy="166" r="6" fill="#ff2e6b" opacity="0.9" />

  <!-- left arm (still) -->
  <rect x="48" y="150" width="12" height="30" rx="6" fill="#2f81f7" />
  <circle cx="54" cy="184" r="9" fill="#8db9ff" />

  <!-- right arm (waving) -->
  <g class="arm">
    <rect x="146" y="98" width="13" height="56" rx="6.5" fill="#2f81f7" />
    <circle cx="152.5" cy="96" r="11" fill="#8db9ff" />
    <circle cx="146" cy="90" r="3" fill="#8db9ff" />
    <circle cx="152.5" cy="87" r="3" fill="#8db9ff" />
    <circle cx="159" cy="90" r="3" fill="#8db9ff" />
  </g>
</svg>
